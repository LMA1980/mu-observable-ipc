[package]
name = "mu-observable-ipc"
version = "0.1.1"
edition = "2021"
description = "Shared wire contracts, Apache Arrow telemetry schemas, OTEL span envelopes, and Apache Fory RPC protocols for MuObserve distributed observability"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/LMA1980/mu-observable-ipc"

[dependencies]
zerocopy = { version = "0.8", features = ["derive"] }
fory = "1.7"
arrow = { version = "54", default-features = false, features = ["ipc"] }
tokio = { version = "1", features = ["io-util", "sync", "macros", "rt"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
